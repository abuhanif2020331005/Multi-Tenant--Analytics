syntax = "proto3";

package platform;

option java_package = "com.platform.grpc";
option java_outer_classname = "PlatformProto";

// ─── Auth Service ────────────────────────────────────────────────────────────

service AuthService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUserClaims (GetUserClaimsRequest) returns (UserClaims);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  UserClaims claims = 2;
  string error = 3;
}

message GetUserClaimsRequest {
  string token = 1;
}

message UserClaims {
  string user_id    = 1;
  string tenant_id  = 2;
  string tenant_slug = 3;
  string email      = 4;
  string role       = 5;
}

// ─── Analytics Service ───────────────────────────────────────────────────────

service AnalyticsService {
  rpc GetEventSummary (EventSummaryRequest) returns (EventSummaryResponse);
  rpc RecordEvent     (RecordEventRequest)  returns (RecordEventResponse);
}

message EventSummaryRequest {
  string tenant_id = 1;
  int32  days      = 2;
}

message EventSummaryResponse {
  int64  total_events     = 1;
  int64  unique_users     = 2;
  int64  product_views    = 3;
  int64  add_to_cart      = 4;
  int64  purchases        = 5;
  double cart_rate        = 6;
  double conversion_rate  = 7;
  int32  window_days      = 8;
}

message RecordEventRequest {
  string tenant_id   = 1;
  string user_id     = 2;
  string event_type  = 3;
  string event_data  = 4;  // JSON string
  string ip_address  = 5;
  string user_agent  = 6;
}

message RecordEventResponse {
  string event_id   = 1;
  string created_at = 2;
}

// ─── Recommendation Service ──────────────────────────────────────────────────

service RecommendationService {
  rpc GetPopularProducts  (PopularProductsRequest)  returns (ProductListResponse);
  rpc GetSimilarProducts  (SimilarProductsRequest)  returns (ProductListResponse);
}

message PopularProductsRequest {
  string tenant_id = 1;
  int32  limit     = 2;
  int32  days      = 3;
}

message SimilarProductsRequest {
  string tenant_id  = 1;
  string product_id = 2;
  int32  limit      = 3;
  int32  days       = 4;
}

message ProductItem {
  string product_id  = 1;
  string name        = 2;
  string category    = 3;
  double price       = 4;
  double score       = 5;
  int64  views       = 6;
  int64  purchases   = 7;
}

message ProductListResponse {
  repeated ProductItem products = 1;
  string strategy               = 2;
  int32  window_days            = 3;
}

// ─── Fraud Detection Service ─────────────────────────────────────────────────

service FraudDetectionService {
  rpc AnalyzeUser  (FraudAnalysisRequest)  returns (FraudAnalysisResponse);
  rpc GetAlerts    (FraudAlertsRequest)    returns (FraudAlertsResponse);
}

message FraudAnalysisRequest {
  string tenant_id                 = 1;
  string user_id                   = 2;
  int32  window_minutes            = 3;
  double purchase_amount_threshold = 4;
  int32  velocity_threshold        = 5;
}

message FraudAnalysisResponse {
  string user_id    = 1;
  string tenant_id  = 2;
  int32  risk_score = 3;
  string risk_level = 4;
  repeated FraudIndicator indicators = 5;
}

message FraudIndicator {
  string code     = 1;
  string severity = 2;
  string message  = 3;
}

message FraudAlertsRequest {
  string tenant_id      = 1;
  int32  hours          = 2;
  int32  min_risk_score = 3;
  int32  limit          = 4;
}

message FraudAlertsResponse {
  repeated FraudAlert alerts = 1;
  int32  lookback_hours      = 2;
  int32  min_risk_score      = 3;
}

message FraudAlert {
  string user_id                  = 1;
  int32  risk_score               = 2;
  int64  purchase_count           = 3;
  int64  high_value_purchase_count = 4;
  string latest_purchase_at       = 5;
}
