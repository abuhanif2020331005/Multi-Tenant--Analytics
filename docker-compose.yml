services:
  # Database Migrator
  db-migrator:
    build:
      context: .
      dockerfile: ./database/migrator/Dockerfile
    container_name: platform-db-migrator
    restart: "no"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - MIGRATIONS_DIR=/migrations
      - MIGRATION_SKIP_FILES=init.sql
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=120
      - REDIS_RATE_LIMIT_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ANALYTICS_SERVICE_URL=http://analytics-service:8003
      - EVENT_INGESTION_SERVICE_URL=http://event-ingestion-service:8004
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8005
      - FRAUD_DETECTION_SERVICE_URL=http://fraud-detection-service:8006
      - CATALOG_SERVICE_URL=http://catalog-service:8008
      - OTEL_ENABLED=false
      - OTEL_EXPORTER_URL=http://otel-collector:4318
      - OTEL_SERVICE_NAME=api-gateway
      # Per-tenant rate limit overrides: key:limit,key:limit (e.g. acme_api_key_12345:500)
      - TENANT_RATE_LIMITS=
    depends_on:
      redis:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      analytics-service:
        condition: service_started
      event-ingestion-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      fraud-detection-service:
        condition: service_started
      catalog-service:
        condition: service_started
    volumes:
      - ./services/api-gateway/src:/app/src
      - ./shared:/shared

  # Dashboard App
  dashboard-app:
    build:
      context: ./services/dashboard-app
      dockerfile: Dockerfile
    container_name: dashboard-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_BASE_URL=http://host.docker.internal:8000
      - PROCESSOR_BASE_URL=http://host.docker.internal:8007
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      api-gateway:
        condition: service_started
      event-processor-service:
        condition: service_started
    volumes:
      - ./services/dashboard-app/src:/app/src
      - ./services/dashboard-app/public:/app/public

  # Tenant Dashboard
  tenant-dashboard:
    build:
      context: ./services/tenant-dashboard
      dockerfile: Dockerfile
    container_name: tenant-dashboard
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - API_BASE_URL=http://api-gateway:8000
      - PUBLIC_API_BASE_URL=/api
      - DEFAULT_TENANT_SLUG=acme
      - DEFAULT_TENANT_API_KEY=acme_api_key_12345
      - DEFAULT_LOGIN_EMAIL=admin@acme.com
      - DEFAULT_LOGIN_PASSWORD=password123
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      api-gateway:
        condition: service_started
    volumes:
      - ./services/tenant-dashboard/src:/app/src
      - ./services/tenant-dashboard/public:/app/public

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: platform-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api-gateway:
        condition: service_started
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      analytics-service:
        condition: service_started
      event-ingestion-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      fraud-detection-service:
        condition: service_started
      event-processor-service:
        condition: service_started

  # Grafana
  grafana:
    image: grafana/grafana:11.1.0
    container_name: platform-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  # Jaeger
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: platform-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: platform-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol/config.yml
    ports:
      - "4319:4317"
      - "4320:4318"
      - "9464:9464"
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      jaeger:
        condition: service_started

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda – Kafka-compatible message broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    container_name: platform-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Topic initializer – creates required Kafka topics on first boot
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    container_name: platform-redpanda-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BROKER=redpanda:9092
        for TOPIC in user-events fraud-alerts recommendation-updates; do
          rpk topic create $$TOPIC --brokers $$BROKER --partitions 3 --replicas 1 2>/dev/null \
            && echo "Created $$TOPIC" || echo "$$TOPIC already exists"
        done
        echo "Topic init done."
    depends_on:
      redpanda:
        condition: service_healthy

  # Ollama local LLM (pull a model with: docker exec platform-ollama ollama pull llama3.2)
  ollama:
    image: ollama/ollama:latest
    container_name: platform-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: platform-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=development
      - PORT=8001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=1h
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - GRPC_ENABLED=false
      - GRPC_PORT=9001
      - OTEL_ENABLED=false
      - OTEL_EXPORTER_URL=http://otel-collector:4318
      - OTEL_SERVICE_NAME=auth-service
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src
      - ./shared:/shared

  # User Service
  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=development
      - PORT=8002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - OTEL_ENABLED=false
      - OTEL_EXPORTER_URL=http://otel-collector:4318
      - OTEL_SERVICE_NAME=analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    volumes:
      - ./services/user-service/src:/app/src
      - ./shared:/shared

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: ./services/analytics-service/Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=development
      - PORT=8003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - OTEL_ENABLED=false
      - OTEL_EXPORTER_URL=http://otel-collector:4318
      - OTEL_SERVICE_NAME=analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    volumes:
      - ./services/analytics-service/src:/app/src
      - ./shared:/shared

  # Event Ingestion Service
  event-ingestion-service:
    build:
      context: .
      dockerfile: ./services/event-ingestion-service/Dockerfile
    container_name: event-ingestion-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=development
      - PORT=8004
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - INGESTION_MODE=broker
      - BROKER_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=user-events
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
    volumes:
      - ./services/event-ingestion-service/src:/app/src
      - ./shared:/shared

  # Event Processor Service
  event-processor-service:
    build:
      context: .
      dockerfile: ./services/event-processor-service/Dockerfile
    container_name: event-processor-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      - NODE_ENV=development
      - PORT=8007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - OUTBOX_BATCH_SIZE=50
      - OUTBOX_POLL_INTERVAL_MS=5000
      - OUTBOX_MAX_RETRY_COUNT=3
      - BROKER_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=user-events
      - KAFKA_CONSUMER_GROUP=event-processor-service-group
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      event-ingestion-service:
        condition: service_started
      redpanda:
        condition: service_started
    volumes:
      - ./services/event-processor-service/src:/app/src
      - ./shared:/shared

  # Recommendation Service
  recommendation-service:
    build:
      context: .
      dockerfile: ./services/recommendation-service/Dockerfile
    container_name: recommendation-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - NODE_ENV=development
      - PORT=8005
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - QDRANT_ENABLED=true
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=product-embeddings
      - QDRANT_VECTOR_SIZE=16
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RECOMMENDATION_CACHE_TTL_SECONDS=120
      - OTEL_ENABLED=false
      - OTEL_EXPORTER_URL=http://otel-collector:4318
      - OTEL_SERVICE_NAME=recommendation-service
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./services/recommendation-service/src:/app/src
      - ./shared:/shared

  # Fraud Detection Service
  fraud-detection-service:
    build:
      context: .
      dockerfile: ./services/fraud-detection-service/Dockerfile
    container_name: fraud-detection-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - NODE_ENV=development
      - PORT=8006
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - OTEL_ENABLED=false
      - OTEL_EXPORTER_URL=http://otel-collector:4318
      - OTEL_SERVICE_NAME=fraud-detection-service
      - FRAUD_WEBHOOK_URL=
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    volumes:
      - ./services/fraud-detection-service/src:/app/src
      - ./shared:/shared

  # Catalog Service
  catalog-service:
    build:
      context: .
      dockerfile: ./services/catalog-service/Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - NODE_ENV=development
      - PORT=8008
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=platform_user
      - DB_PASSWORD=platform_pass
      - DB_NAME=platform_db
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - QDRANT_ENABLED=true
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=product-embeddings
      - QDRANT_VECTOR_SIZE=16
      - OLLAMA_ENABLED=false
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    volumes:
      - ./services/catalog-service/src:/app/src
      - ./shared:/shared

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  ollama_data:

