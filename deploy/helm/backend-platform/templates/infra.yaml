{{- if .Values.infra.redpanda.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-platform.fullname" . }}-redpanda
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "backend-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redpanda
  template:
    metadata:
      labels:
        {{- include "backend-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redpanda
    spec:
      containers:
        - name: redpanda
          image: "{{ .Values.images.redpanda.repository }}:{{ .Values.images.redpanda.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - "1G"
            - --reserve-memory
            - "0M"
            - --node-id
            - "0"
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://{{ include "backend-platform.fullname" . }}-redpanda:9092
          ports:
            - containerPort: {{ .Values.infra.redpanda.port }}
              name: kafka
          resources:
            {{- toYaml .Values.infra.redpanda.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend-platform.fullname" . }}-redpanda
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  selector:
    {{- include "backend-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
  ports:
    - name: kafka
      port: {{ .Values.infra.redpanda.port }}
      targetPort: kafka
{{- end }}
