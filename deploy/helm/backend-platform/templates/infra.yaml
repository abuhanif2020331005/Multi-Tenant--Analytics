---
{{- if .Values.infra.otelCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-platform.fullname" . }}-otel-collector
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "backend-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "backend-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: "{{ .Values.images.otelCollector.repository }}:{{ .Values.images.otelCollector.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --config=/etc/otelcol/config.yml
          ports:
            - containerPort: {{ .Values.infra.otelCollector.grpcPort }}
              name: otlp-grpc
            - containerPort: {{ .Values.infra.otelCollector.httpPort }}
              name: otlp-http
            - containerPort: {{ .Values.infra.otelCollector.metricsPort }}
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            {{- toYaml .Values.infra.otelCollector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "backend-platform.fullname" . }}-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend-platform.fullname" . }}-otel-collector
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  selector:
    {{- include "backend-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: {{ .Values.infra.otelCollector.grpcPort }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.infra.otelCollector.httpPort }}
      targetPort: otlp-http
    - name: metrics
      port: {{ .Values.infra.otelCollector.metricsPort }}
      targetPort: metrics
{{- end }}
