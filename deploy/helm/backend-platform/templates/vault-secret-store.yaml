{{- if .Values.secrets.externalSecret.enabled }}
# ExternalSecret – pulls secrets from Vault via the External Secrets Operator
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "backend-platform.fullname" . }}-vault-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "backend-platform.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: backend-platform/jwt
        property: secret
    - secretKey: DB_PASSWORD
      remoteRef:
        key: backend-platform/database
        property: password
    - secretKey: DB_USER
      remoteRef:
        key: backend-platform/database
        property: username
    - secretKey: DB_NAME
      remoteRef:
        key: backend-platform/database
        property: name
---
# ClusterSecretStore – connects to Vault
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
  labels:
    {{- include "backend-platform.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: "{{ .Values.vault.address | default "http://vault:8200" }}"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "backend-platform"
          serviceAccountRef:
            name: {{ include "backend-platform.fullname" . }}-vault-sa
            namespace: {{ .Values.namespace.name }}
{{- end }}
