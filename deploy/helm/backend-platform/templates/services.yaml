{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-platform.fullname" $ }}-{{ kebabcase $name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ kebabcase $name }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "backend-platform.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ kebabcase $name }}
  template:
    metadata:
      labels:
        {{- include "backend-platform.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ kebabcase $name }}
    spec:
      containers:
        - name: {{ kebabcase $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            {{- range $envName, $envValue := $svc.env }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend-platform.fullname" $ }}-{{ kebabcase $name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ kebabcase $name }}
spec:
  type: {{ $svc.serviceType }}
  selector:
    {{- include "backend-platform.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ kebabcase $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
{{- if $svc.autoscaling }}
{{- if $svc.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "backend-platform.fullname" $ }}-{{ kebabcase $name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "backend-platform.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "backend-platform.fullname" $ }}-{{ kebabcase $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage | default 70 }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
