apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_REPO.git
    targetRevision: main
    path: backend-platform/deploy/helm/backend-platform
    helm:
      valueFiles:
        - ../../argocd/values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: analytics-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
