name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend-platform/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend-platform/**'

defaults:
  run:
    working-directory: backend-platform

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate docker-compose
        run: docker compose config --quiet

      - name: Validate Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
        continue-on-error: true

      - name: Helm lint
        run: |
          helm lint deploy/helm/backend-platform || echo "Helm not available, skipping"
        continue-on-error: true

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-validate
    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: auth-service
            dockerfile: services/auth-service/Dockerfile
          - name: user-service
            dockerfile: services/user-service/Dockerfile
          - name: analytics-service
            dockerfile: services/analytics-service/Dockerfile
          - name: event-ingestion-service
            dockerfile: services/event-ingestion-service/Dockerfile
          - name: event-processor-service
            dockerfile: services/event-processor-service/Dockerfile
          - name: recommendation-service
            dockerfile: services/recommendation-service/Dockerfile
          - name: fraud-detection-service
            dockerfile: services/fraud-detection-service/Dockerfile
          - name: catalog-service
            dockerfile: services/catalog-service/Dockerfile
          - name: dashboard-app
            dockerfile: services/dashboard-app/Dockerfile
          - name: tenant-dashboard
            dockerfile: services/tenant-dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: backend-platform
          file: backend-platform/${{ matrix.service.dockerfile }}
          push: false
          tags: backend-platform/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-images
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_user -d platform_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run DB migrations
        working-directory: backend-platform
        run: |
          PGPASSWORD=platform_pass psql -h localhost -U platform_user -d platform_db -f database/migrations/init.sql
          PGPASSWORD=platform_pass psql -h localhost -U platform_user -d platform_db -f database/migrations/2026-04-25-product-embeddings.sql || true

      - name: Install auth-service deps
        working-directory: backend-platform/services/auth-service
        run: npm ci --omit=dev

      - name: Health check auth-service
        working-directory: backend-platform
        env:
          PORT: 8001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: platform_user
          DB_PASSWORD: platform_pass
          DB_NAME: platform_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 1h
          REFRESH_TOKEN_EXPIRES_IN: 7d
        run: |
          node services/auth-service/src/index.js &
          AUTH_PID=$!
          sleep 3
          curl -sf http://localhost:8001/health | grep '"status":"healthy"'
          kill $AUTH_PID

      - name: Install analytics-service deps
        working-directory: backend-platform/services/analytics-service
        run: npm ci --omit=dev

      - name: Health check analytics-service
        working-directory: backend-platform
        env:
          PORT: 8003
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: platform_user
          DB_PASSWORD: platform_pass
          DB_NAME: platform_db
          JWT_SECRET: ci-test-secret
        run: |
          node services/analytics-service/src/index.js &
          ANALYTICS_PID=$!
          sleep 3
          curl -sf http://localhost:8003/health | grep '"status":"healthy"'
          kill $ANALYTICS_PID

  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - analytics-service
          - event-ingestion-service
          - event-processor-service
          - recommendation-service
          - fraud-detection-service
          - catalog-service
          - dashboard-app
          - tenant-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: backend-platform
          file: backend-platform/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend-platform/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/backend-platform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
