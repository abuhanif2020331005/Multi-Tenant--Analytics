name: Containers And Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/containers-and-chart.yml"
      - "database/**"
      - "deploy/helm/**"
      - "services/**"
      - "shared/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - image: auth-service
            dockerfile: ./services/auth-service/Dockerfile
          - image: user-service
            dockerfile: ./services/user-service/Dockerfile
          - image: analytics-service
            dockerfile: ./services/analytics-service/Dockerfile
          - image: event-ingestion-service
            dockerfile: ./services/event-ingestion-service/Dockerfile
          - image: event-processor-service
            dockerfile: ./services/event-processor-service/Dockerfile
          - image: recommendation-service
            dockerfile: ./services/recommendation-service/Dockerfile
          - image: fraud-detection-service
            dockerfile: ./services/fraud-detection-service/Dockerfile
          - image: catalog-service
            dockerfile: ./services/catalog-service/Dockerfile
          - image: dashboard-app
            dockerfile: ./services/dashboard-app/Dockerfile
          - image: tenant-dashboard
            dockerfile: ./services/tenant-dashboard/Dockerfile
          - image: db-migrator
            dockerfile: ./database/migrator/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  package-helm-chart:
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/backend-platform

      - name: Package chart
        run: mkdir -p dist && helm package deploy/helm/backend-platform --destination dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-platform-helm-chart
          path: dist/*.tgz
