name: CD – Deploy to Kubernetes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: GitOps Deploy via ArgoCD
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        continue-on-error: true

      - name: Update image tags in Helm values
        working-directory: backend-platform/deploy/helm/backend-platform
        run: |
          SHA=${{ github.sha }}
          sed -i "s/tag: latest/tag: ${SHA}/g" values.yaml

      - name: Helm upgrade (dry-run)
        working-directory: backend-platform
        run: |
          helm upgrade --install backend-platform deploy/helm/backend-platform \
            --namespace analytics-platform \
            --create-namespace \
            --dry-run \
            --set global.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --set global.db.password="${{ secrets.DB_PASSWORD }}" \
            || echo "Dry-run complete (kubeconfig may not be configured in this environment)"

      - name: Sync ArgoCD application
        run: |
          if command -v argocd &> /dev/null; then
            argocd app sync backend-platform \
              --server "${{ secrets.ARGOCD_SERVER }}" \
              --auth-token "${{ secrets.ARGOCD_TOKEN }}" \
              --grpc-web
          else
            echo "ArgoCD CLI not available – skipping sync (configure ARGOCD_SERVER and ARGOCD_TOKEN secrets)"
          fi
        continue-on-error: true

      - name: Notify deployment
        run: |
          echo "Deployment triggered for commit ${{ github.sha }}"
          echo "Images: ghcr.io/${{ github.repository_owner }}/backend-platform/*:${{ github.sha }}"
